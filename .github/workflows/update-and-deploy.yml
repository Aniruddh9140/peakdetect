name: Update data and deploy

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

# A data run and a code push must not race to commit or deploy.
concurrency:
  group: update-and-deploy
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Queued runs must start from the newest data, not the commit that triggered them.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      # The free AI model is cached so it downloads once, not on every run.
      - name: Cache AI model
        if: github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: ~/ollama-models
          key: ollama-qwen3-4b

      - name: Start built-in AI
        if: github.event_name != 'push'
        env:
          OLLAMA_VERSION: 0.40.6
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          OLLAMA_MODELS="$HOME/ollama-models" nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          timeout 60 sh -c 'until curl -s http://127.0.0.1:11434 > /dev/null; do sleep 1; done'
          ollama pull qwen3:4b

      - name: Collect live data
        if: github.event_name != 'push'
        env:
          OLLAMA_URL: http://127.0.0.1:11434
        run: npm run update-data

      # The commit keeps the last good data and counts as activity, which stops
      # GitHub disabling the schedule after 60 quiet days.
      - name: Save data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/latest.json
          git diff --staged --quiet || git commit -m "Update disease data"
          git pull --rebase origin main
          git push

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - id: deployment
        uses: actions/deploy-pages@v4
